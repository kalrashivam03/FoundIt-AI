<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Found Item | FoundIt AI</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body id="foundPage">
    <nav class="navbar">
        <div class="navbar-left">
            <button class="back-button" id="backBtn" title="Go Back">⬅️</button>
            <div class="logo">
                <img src="magnifying-glass-is-black-background_1186366-52229.avif" alt="FoundIt AI Logo">
            </div>
            <div class="brand">
                <div class="brand-name">FoundIt AI</div>
                <div class="brand-tagline">Smart Matching. Faster Recovery.</div>
            </div>
        </div>

        <div class="navbar-right">
            <div class="notification-container">
                <button class="notification-icon" id="notificationBtn" title="Notifications">
                    🔔
                </button>
                <span class="notification-badge" id="notificationBadge">0</span>
                <div class="notification-dropdown" id="notificationDropdown">
                    <div class="notification-header">Notifications</div>
                    <div class="notification-empty">No notifications yet</div>
                </div>
            </div>
            <a href="gallery.html" class="btn-nav">Gallery</a>
            <a href="signin.html" class="btn-nav">Sign In</a>
            <a href="signup.html" class="btn-nav">Sign Up</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card" style="max-width: 500px;">
            <h1 class="auth-title">Report Found Item</h1>

            <form id="foundForm" class="auth-form">
                <input type="text" id="itemName" name="itemName" placeholder="Item name" class="auth-input" required>

                <textarea id="description" name="description" placeholder="Description" class="auth-input" rows="3" required></textarea>

                <input type="text" id="location" name="location" placeholder="Found location" class="auth-input" required>

                <input type="datetime-local" id="foundDate" name="foundDate" class="auth-input" required>

                <input type="tel" id="contact" name="contact" placeholder="Your contact number" class="auth-input" required>

                <div class="file-upload">
                    <label for="itemImage" class="file-label">Upload Item Image (Optional) - AI will analyze for better matching</label>
                    <input type="file" id="itemImage" name="itemImage" accept="image/*" class="auth-input file-input">
                    <div id="imagePreview" class="image-preview"></div>
                </div>

                <button type="submit" class="btn-submit">Submit Report</button>
            </form>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
