<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | FoundIt AI</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body id="signupPage">
    <button class="back-button back-button-fixed" id="backBtn" title="Go Back">⬅️ Back</button>
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">Sign Up</h1>

            <form id="signupForm" class="auth-form">
                <input type="email" id="email" name="email" placeholder="Enter your email" class="auth-input" required>

                <input type="password" id="password" name="password" placeholder="Enter your password" class="auth-input" required>

                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" class="auth-input" required>

                <button type="submit" class="btn-submit">Submit</button>

                <a href="signin.html" class="auth-link">Already have an account? Sign In</a>
            </form>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
