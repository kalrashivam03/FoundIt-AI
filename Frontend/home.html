<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>FoundIt AI – Lost & Found</title>
</head>

<body id="homePage" style="margin:0; font-family:Arial, Helvetica, sans-serif; background-color:#f4f6f8;">

    <!-- NAVBAR -->
    <div style="display:flex; justify-content:space-between; align-items:center; padding:20px 25px;background-color:#086bb8; color:white;">
        <!-- Left Section: Logo + Name + Welcome -->
        <div style="display:flex; align-items:center; gap:15px;">
            <div style="width:40px; height:40px;border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; color:#0f1011;">
                <img style="width: 40px; height: 40px; border-radius: 50%;" src="magnifying-glass-is-black-background_1186366-52229.avif" alt="">
            </div>
            <div>
                <div style="font-size:22px; font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif; font-weight:bold;">FoundIt AI</div>
                <div style="font-size:12px; color:#cbd5e1;">Smart Matching. Faster Recovery.</div>
            </div>
        </div>

        <!-- Right Section: Sign In / Sign Up -->
        <div style="display:flex; gap:10px;">
            <a href="#" style="text-decoration:none; color:#ffffff; padding:8px 16px; border-radius:5px; border:2px solid #38bdf8; font-weight:bold;" onmouseover="this.style.backgroundColor='#38bdf8'; this.style.color='#1e293b';" onmouseout="this.style.backgroundColor=''; this.style.color='#ffffff';">
                Sign In
            </a>

            <a href="#" style="text-decoration:none; color:#ffffff; padding:8px 16px; border-radius:5px; border:2px solid #38bdf8; font-weight:bold;" onmouseover="this.style.backgroundColor='#38bdf8'; this.style.color='#1e293b';" onmouseout="this.style.backgroundColor=''; this.style.color='#ffffff';">
                Sign Up
            </a>
        </div>

    </div>

    <!-- HERO SECTION -->
    <div style="text-align:center; height: 483px; padding:50px 20px; background-color: rgb(106, 180, 230);">
        <h1 style="font-size:60px; color:#000000; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">
            Lost Something? Found Something?
        </h1>
        <p style="font-size:25px; color:#2b3138; max-width:900px; margin:20px auto; font-weight: bold;">
            FoundIt AI helps you report lost items, match them intelligently,
            and ensure safe handovers within your campus or community.
        </p>

        <!-- Action Buttons -->
        <div style="margin-top:80px; display:flex; justify-content:center; gap:40px;">
            <a href="#" style="text-decoration:none; font-family: 'Times New Roman', Times, serif; background-color:#fee2e2; color:#7f1d1d; padding:40px 50px; border-radius:12px; font-size:28px; font-weight:bold; width:260px; text-align:center; box-shadow:0 10px 20px rgba(255,0,0,0.15); transition:0.3s;"
            onmouseover="this.style.backgroundColor='#ef4444'; this.style.color='#ffffff'; this.style.transform='scale(1.05)';"
            onmouseout="this.style.backgroundColor='#fee2e2'; this.style.color='#7f1d1d'; this.style.transform='scale(1)';">
                Report<br>Lost Item
            </a>

            <a href="#" style="text-decoration:none; font-family: 'Times New Roman', Times, serif; background-color:#dcfce7; color:#14532d; padding:40px 50px; border-radius:12px; font-size:28px; font-weight:bold; width:260px; text-align:center; box-shadow:0 10px 20px rgba(0,255,0,0.15); transition:0.3s;"
            onmouseover="this.style.backgroundColor='#22c55e'; this.style.color='#ffffff'; this.style.transform='scale(1.05)';"
            onmouseout="this.style.backgroundColor='#dcfce7'; this.style.color='#14532d'; this.style.transform='scale(1)';">
                Report<br>Found Item
            </a>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
