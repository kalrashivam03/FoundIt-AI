<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | FoundIt AI</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body id="signinPage">
    <button class="back-button back-button-fixed" id="backBtn" title="Go Back">⬅️ Back</button>
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">Sign In</h1>

            <form id="signinForm" class="auth-form">
                <input type="text" id="username" name="username" placeholder="Enter your email" class="auth-input" required>

                <input type="password" id="password" name="password" placeholder="Enter your password" class="auth-input" required>

                <a href="#" class="auth-link">Forgot password?</a>

                <button type="submit" class="btn-submit">Submit</button>

                <a href="signup.html" class="auth-link">Don't have an account? Sign Up</a>
            </form>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
